# Isolated analytic/PVS research recipes, not a ROS or field mission profile.
mission_geometry: shallow_cosine_zigzag_exit_parity_candidate
prior_frame: local_ned
prerequisites:
  bounded_crosscurrent_vector_and_uncertainty: true
  independently_bounded_target_side: true
  convex_obstacle_free_corridor: true
  measured_turn_and_stop_envelopes: false  # Must be supplied before deployment.
  target_identity_from_magnetic_profiles: false
  burial_depth_without_independent_calibration: false
common:
  half_wavelength_m: 135.0
  waypoint_spacing_m: 0.5
  velocity_mps: 0.3
  minimum_turn_radius_m: 50.0
  boundary_margin_m: 5.0
  prior_offset_bound_m: 6.0
  prior_heading_error_bound_deg: 1.15
  half_crossing_bound_m: 5.2
  tail_margin_m: 1.5
  navigation_lateral_margin_m: 3.0
positive_crosscurrent_upstream_negative_start:
  initial_lateral_sign: -1
  station_count: 3
  amplitude_m: 24.0
  boundary_y_halfwidth_m: 42.0
negative_crosscurrent_upstream_positive_start:
  initial_lateral_sign: 1
  station_count: 4
  amplitude_m: 27.0
  boundary_y_halfwidth_m: 45.0
release:
  survey_geometry_only: true
  track_executed: false
  ros_or_pc104_field_release: false
